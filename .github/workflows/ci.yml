name: CI - Build and Unit Tests

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: windows-2022

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2

    # 还原旧式 packages.config 依赖（Newtonsoft.Json / SkiaSharp.NativeAssets 等）
    - name: Restore NuGet (packages.config)
      shell: pwsh
      run: |
        nuget restore EcgBpAnalysis.sln -NonInteractive
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

    # 还原 PackageReference 依赖（EF Core / SQLitePCLRaw 等）
    - name: Restore NuGet (PackageReference)
      run: msbuild EcgAnalyseStart\EcgBpAnalysis.csproj /t:Restore /p:Configuration=Release /p:Platform="Any CPU" /v:m /nologo

    # 强制下载清单中所有直接引用的包（含 Crc32.NET 等无 packages.config 声明的包）
    - name: Prepare direct packages
      shell: pwsh
      run: |
        $base = Join-Path $env:GITHUB_WORKSPACE 'packages'
        $dl = Join-Path $env:RUNNER_TEMP 'nuget'
        New-Item -ItemType Directory -Force -Path $dl | Out-Null
        $manifest = Join-Path $env:GITHUB_WORKSPACE 'TEST\nuget-packages.txt'
        Get-Content $manifest -Encoding UTF8 | Where-Object { $_ -and -not $_.StartsWith('#') } | ForEach-Object {
          $parts = $_ -split '\|'
          $id = $parts[0].Trim()
          $ver = $parts[1].Trim()
          $dirName = "$id.$ver"
          $dst = Join-Path $base $dirName
          if (Test-Path $dst) { Write-Host "skip existing $dirName"; return }
          $url = "https://api.nuget.org/v3-flatcontainer/$($id.ToLower())/$ver/$($id.ToLower()).$ver.nupkg"
          $zip = Join-Path $dl "$dirName.zip"
          Write-Host "download $dirName"
          Invoke-WebRequest -Uri $url -OutFile $zip -UseBasicParsing
          Expand-Archive -Path $zip -DestinationPath $dst -Force
        }
        # 项目 HintPath 指向 lib/net46，而 ValueTuple 4.5.0 仅含 net461，补一份
        $vt = Join-Path $base 'System.ValueTuple.4.5.0\lib'
        New-Item -ItemType Directory -Force -Path (Join-Path $vt 'net46') | Out-Null
        Copy-Item (Join-Path $vt 'net461\System.ValueTuple.dll') (Join-Path $vt 'net46\System.ValueTuple.dll') -Force

    # netstandard.dll 外观程序集：runner 的 4.7.2+ 目标包含有，复制到项目期望位置
    - name: Prepare netstandard facade
      shell: pwsh
      run: |
        $src = 'C:\Program Files (x86)\Reference Assemblies\Microsoft\Framework\.NETFramework\v4.7.2\Facades\netstandard.dll'
        $dst = Join-Path $env:GITHUB_WORKSPACE 'packages\NetStandardFacade'
        New-Item -ItemType Directory -Force -Path $dst | Out-Null
        if (Test-Path $src) { Copy-Item $src (Join-Path $dst 'netstandard.dll') -Force }
        else { Write-Host 'netstandard.dll not at expected path; will rely on installed targeting pack' }

    - name: Build solution
      shell: pwsh
      run: |
        msbuild EcgBpAnalysis.sln /t:Build /p:Configuration=Release /p:Platform="Any CPU" /m /v:m /nologo 2>&1 | Tee-Object -FilePath build.log
        if ($LASTEXITCODE -ne 0) {
          Get-Content build.log -Encoding UTF8 | Select-String -Pattern 'error |Build FAILED' | ForEach-Object {
            $line = $_.Line.Substring(0, [Math]::Min(400, $_.Line.Length))
            Write-Host "::error::$line"
          }
          exit $LASTEXITCODE
        }

    - name: Build unit tests
      run: msbuild TEST\UnitTests\EcgBpAnalysis.UnitTests.csproj /t:Build /p:Configuration=Release /p:Platform=AnyCPU /v:m /nologo

    - name: Upload build log on failure
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: build-log
        path: build.log

    - name: Run unit tests
      shell: pwsh
      run: |
        # 用 runner 自带的 vswhere 定位 vstest.console.exe（不依赖不存在的 setup-vstest action）
        $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
        $vsPath = & $vswhere -latest -products * -property installationPath
        $vstest = Join-Path $vsPath 'Common7\IDE\Extensions\TestPlatform\vstest.console.exe'
        if (-not (Test-Path $vstest)) {
          $vstest = Join-Path $vsPath 'Common7\IDE\CommonExtensions\Microsoft\TestWindow\vstest.console.exe'
        }
        Write-Host "vstest.console = $vstest"
        $dll = Join-Path $env:GITHUB_WORKSPACE 'TEST\UnitTests\bin\Release\EcgBpAnalysis.UnitTests.dll'
        $adapter = Join-Path $env:GITHUB_WORKSPACE 'packages\MSTest.TestAdapter.2.2.10'
        & $vstest $dll /TestAdapterPath:"$adapter" /Logger:console
